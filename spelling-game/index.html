<script>
/* =====================================================================
   WÖRTERLISTE – HIER BEARBEITEN
   ---------------------------------------------------------------------
   Jede Zeile ist ein Wort. Vier Teile:
     de:    das deutsche Wort. Gibt es zwei richtige Wörter, mit Komma trennen ("das, dies").
     en:    das englische Wort
     why:   kurzer Satz zum ENGLISCHEN Wort (Teil 1: Deutsch → Englisch)
     whyDe: kurzer Satz zum DEUTSCHEN Wort (Teil 2: Englisch → Deutsch)
   Neues Wort: eine Zeile kopieren, Text ändern, Komma am Ende nicht vergessen.
   ===================================================================== */
const WORDS = [
  { de: "Gelb",                         en: "yellow",              why: "Yellow hat zwei l und endet mit ow.",                  whyDe: "Gelb endet mit b, nicht mit p." },
  { de: "Null",                         en: "zero",                why: "Zero fängt mit z an, aber man spricht es wie s.",      whyDe: "Null hat am Ende zwei l." },
  { de: "Vier",                         en: "four",                why: "Four hat ein u, wie bei your.",                        whyDe: "Vier fängt mit v an und hat ie." },
  { de: "Acht",                         en: "eight",               why: "Eight hat das gh, wie night.",                         whyDe: "Acht hat ch, wie lachen." },
  { de: "Englisch",                     en: "English",             why: "Am Ende steht sh, nicht sch.", whyDe: "Englisch endet mit sch. Auf Englisch ist es nur sh." },
  { de: "Tschüss",                      en: "See you later",       why: "See hat zwei e. Later hat nur ein t.",                 whyDe: "Tschüss fängt mit tsch an und endet mit ss." },
  { de: "Danke",                        en: "Thank you",           why: "Thank fängt mit th an und endet mit nk.",              whyDe: "Danke hat nk, wie trinken." },
  { de: "das, dies",                    en: "this",                why: "This fängt mit th an, wie the.",                       whyDe: "Dies hat ie, wie vier. Das hat nur ein s." },
  { de: "sagen, sprechen",              en: "speak",               why: "Speak hat ea. Man spricht es wie ii.",                 whyDe: "Sprechen hat ch, wie lachen. Sagen hat ein g." },
  { de: "Waschbär",                     en: "raccoon",             why: "Raccoon hat zwei c und zwei o.",                       whyDe: "Waschbär hat sch und ä, wie Bär." },
  { de: "Kannst du das buchstabieren?", en: "Can you spell this?", why: "Spell hat am Ende zwei l.",                            whyDe: "Buchstabieren hat ie, wie vier. Kannst hat zwei n." },
  { de: "Woher kommst du?",             en: "Where are you from?", why: "Where hat ein h nach dem w, wie what.",                whyDe: "Kommst hat zwei m. Woher hat ein h." },
];
/* ===================== Ende der Wörterliste ===================== */
</script>

<style>
  /* Layout: one centred play card on a bright sky field; huge hyperlegible letters for video calls. */
  :root {
    --bg: #dff0ff;
    --bg-dot: #c6e3ff;
    --card: #ffffff;
    --ink: #13213d;
    --ink-soft: #4a5a7a;
    --accent: #ff6b1a;       /* orange: main buttons */
    --accent-ink: #ffffff;
    --accent-press: #e0530a;
    --good: #12a150;         /* green: right */
    --good-soft: #d9f7e5;
    --try: #7a4dff;          /* purple: "Fast!" / try again (never red) */
    --try-soft: #ece5ff;
    --mark: #ffe14d;         /* highlighter for tricky letters */
    --mark-ink: #13213d;
    --line: #c9d8ee;

  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #0e1a33; --bg-dot: #16264a; --card: #1a2b50; --ink: #f2f6ff; --ink-soft: #b3c2e0;
      --accent: #ff8a3d; --accent-ink: #1a0d00; --accent-press: #ffa266;
      --good: #3ddc84; --good-soft: #143b2a; --try: #a98bff; --try-soft: #2c2557;
      --mark: #ffe14d; --mark-ink: #13213d; --line: #2e4372; --sky-top: #24386a; color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #0e1a33; --bg-dot: #16264a; --card: #1a2b50; --ink: #f2f6ff; --ink-soft: #b3c2e0;
    --accent: #ff8a3d; --accent-ink: #1a0d00; --accent-press: #ffa266;
    --good: #3ddc84; --good-soft: #143b2a; --try: #a98bff; --try-soft: #2c2557;
    --mark: #ffe14d; --mark-ink: #13213d; --line: #2e4372; --sky-top: #24386a; color-scheme: dark;
  }

  *, *::before, *::after { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    background-image: radial-gradient(var(--bg-dot) 2px, transparent 2px);
    background-size: 28px 28px;
    color: var(--ink);
    font-family: var(--font-display);
    font-size: 20px;
    padding-left: max(16px, env(safe-area-inset-left, 0px));
    padding-right: max(16px, env(safe-area-inset-right, 0px));
    padding-block: 16px 32px;
  }
  main { max-width: 680px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px; }

  /* Top bar: round progress + plant */
  .bar { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; }
  .dots { display: flex; gap: 8px; flex-wrap: wrap; }
  .dot.gap { margin-left: 14px; }
  .lang { margin: 0; font-size: 18px; font-weight: 600; letter-spacing: .04em; color: var(--accent-press); }
  .dot {
    width: 30px; height: 30px; border-radius: 50%;
    border: 3px solid var(--line); background: var(--card);
    display: grid; place-items: center; font-size: 16px; line-height: 1;
  }
  .dot.now { border-color: var(--accent); transform: scale(1.15); }
  .dot.star { border-color: var(--good); background: var(--good-soft); }
  .dot.done { border-color: var(--try); background: var(--try-soft); }
  /* Garden: the pumpkin plant, wide and big above the play card */
  .garden {
    position: relative; width: 100%; height: clamp(120px, 34vw, 230px);
    background: linear-gradient(var(--sky-top), var(--card) 70%);
    border: 3px solid var(--line); border-radius: var(--radius); overflow: hidden;
  }
  .garden svg { position: absolute; inset: 0; width: 100%; height: 100%; }
  .garden .stage {
    position: absolute; top: 8px; left: 12px; margin: 0;
    font-size: 17px; font-weight: 600; color: var(--ink-soft);
    background: var(--card); border-radius: 999px; padding: 2px 12px;
  }
  .garden .grower { transform-box: view-box; transform-origin: 120px 118px; }
  .garden.grow .grower { animation: grow .7s ease-out; }
  @keyframes grow { 0% { transform: scale(.96); } 60% { transform: scale(1.03); } 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .garden.grow .grower { animation: none; } }

  .card {
    background: var(--card);
    border-radius: var(--radius);
    border: 3px solid var(--line);
    box-shadow: 0 6px 0 var(--line);
    padding: 28px 22px;
    display: flex; flex-direction: column; align-items: center; gap: 20px;
    text-align: center;
  }
  .hello { margin: 0; font-size: 22px; color: var(--ink-soft); font-weight: 500; }
  .label { margin: 0; font-size: 22px; font-weight: 600; color: var(--ink-soft); }
  .hint {
    margin: 0; font-weight: 700; line-height: 1.1;
    font-size: clamp(40px, 11vw, 72px);
    text-wrap: balance; overflow-wrap: anywhere;
  }

  /* Buttons */
  button {
    font: inherit; cursor: pointer; border: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .btn {
    min-height: 64px; padding: 12px 32px; border-radius: 999px;
    font-size: 26px; font-weight: 700;
    background: var(--accent); color: var(--accent-ink);
    box-shadow: 0 6px 0 var(--accent-press);
    transition: transform .08s ease, box-shadow .08s ease, filter .15s ease;
  }
  .btn:hover { filter: brightness(1.08); transform: translateY(-2px); box-shadow: 0 8px 0 var(--accent-press); }
  .btn:active { transform: translateY(5px); box-shadow: 0 1px 0 var(--accent-press); }
  .btn.green { background: var(--good); box-shadow: 0 6px 0 color-mix(in srgb, var(--good) 70%, #000); color: #fff; }
  .btn.green:active { box-shadow: 0 1px 0 color-mix(in srgb, var(--good) 70%, #000); }
  .btn-ghost {
    min-height: 56px; padding: 8px 22px; border-radius: 999px;
    font-size: 22px; font-weight: 600;
    background: var(--card); color: var(--ink); border: 3px solid var(--line);
    transition: transform .08s ease, border-color .15s ease, background .15s ease;
  }
  .btn-ghost:hover { border-color: var(--accent); transform: translateY(-2px); }
  .btn-ghost.talking { border-color: var(--good); background: var(--good-soft); }
  .btn-ghost:disabled { opacity: .6; cursor: default; transform: none; }
  .btn-ghost:active { transform: translateY(2px) scale(.97); background: var(--bg); }
  button:focus-visible, input:focus-visible { outline: 4px solid var(--try); outline-offset: 3px; }

  /* Answer box */
  form { width: 100%; display: flex; flex-direction: column; align-items: center; gap: 18px; }
  .answer {
    width: 100%;
    font-family: var(--font-word); font-weight: 700;
    font-size: clamp(30px, 8vw, 46px);
    text-align: center; letter-spacing: .04em;

  }
  .answer:focus { border-color: var(--accent); outline: none; }

  /* Feedback */
  .msg { margin: 0; font-size: clamp(34px, 9vw, 52px); font-weight: 700; line-height: 1.1; }
  .msg.good { color: var(--good); }
  .msg.try { color: var(--try); }
  .why {
    margin: 0; font-size: 24px; line-height: 1.4; font-weight: 500;
    background: var(--good-soft); color: var(--ink); border-radius: 16px; padding: 14px 18px;
    max-width: 30ch;
  }
  .compare { width: 100%; display: grid; gap: 10px; }
  .row { display: grid; gap: 4px; padding: 12px; border-radius: 16px; }
  .row.you { background: var(--try-soft); }
  .row.right { background: var(--good-soft); }
  .row .who { font-size: 18px; font-weight: 600; color: var(--ink-soft); }
  .word {
    font-family: var(--font-word); font-weight: 700;
    font-size: clamp(32px, 9vw, 54px); letter-spacing: .06em; line-height: 1.25;
    overflow-wrap: anywhere;
  }
  .word .bad { text-decoration: line-through; text-decoration-thickness: 3px; color: var(--try); }
  .word .tricky { background: var(--mark); color: var(--mark-ink); border-radius: 6px; padding: 0 2px; }
  .timer { width: 100%; height: 12px; border-radius: 999px; background: var(--line); overflow: hidden; }
  .timer > i { display: block; height: 100%; width: 100%; background: var(--good); transform-origin: left; }
  .timer.run > i { animation: shrink 3s linear forwards; }
  @keyframes shrink { to { transform: scaleX(0); } }
  .hidden-word { font-family: var(--font-word); font-size: 44px; letter-spacing: .3em; color: var(--ink-soft); }

  /* End of round */
  .stars { font-size: clamp(30px, 8vw, 52px); letter-spacing: 4px; line-height: 1.2; overflow-wrap: anywhere; }
  .score { margin: 0; font-size: 26px; font-weight: 600; }
  .pop { animation: pop .35s ease-out; }
  @keyframes pop { from { transform: scale(.85); opacity: .4; } to { transform: scale(1); opacity: 1; } }

  /* Confetti */
  .confetti { position: fixed; inset: 0; pointer-events: none; overflow: hidden; z-index: 20; }
  .confetti span { position: absolute; top: -60px; font-size: 34px; animation: fall linear forwards; }
  @keyframes fall { to { transform: translateY(115vh) rotate(540deg); } }

  @media (prefers-reduced-motion: reduce) {
    .pop, .confetti span { animation: none; }
    .confetti { display: none; }
    .timer.run > i { animation-duration: 3s; }
    .btn, .btn-ghost { transition: none; }
  }
  @media (max-width: 420px) {
    .card { padding: 22px 14px; }
    .dot { width: 24px; height: 24px; font-size: 13px; border-width: 2px; }

    .dot.gap { margin-left: 10px; }
    .btn { width: 100%; }
  }
</style>

<main>
  <div class="bar">
    <div class="dots" id="dots" aria-label="Fortschritt"></div>
  </div>
  <div class="garden" id="plant" role="img" aria-label="Dein Kürbis" title="Dein Kürbis wächst bei jedem Wort."></div>
  <section class="card" id="card" aria-live="polite"></section>
</main>
<div class="confetti" id="confetti" aria-hidden="true"></div>

<script>
(function () {
  const ROUND_SIZE = 5;
  const SHOW_MS = 3000;           // how long the right word stays visible
  const card = document.getElementById("card");
  const dotsEl = document.getElementById("dots");
  const plantEl = document.getElementById("plant");

  const missed = new Set();       // words he got wrong (only for this visit)
  const seen = new Map();         // how often each word was asked
  // The pumpkin plant grows with every finished word, right or wrong.
  // Words wrong on the first try make it slowly a bit yellow or brown.
  // It never dies: words right on the first try make it greener again.
  // 10 stages, one per word: seed, sprout, seed leaves, first true leaf, vine,
  // flowers, small pumpkin, big green pumpkin, turning orange, ripe, carved face.
  // After that a new pumpkin grows on the vine every 10 words (up to 3).
  let growth = 0;                 // finished words
  let thirst = 0;                 // 0–6; colour changes every 2 points (never worse than yellow-brown)
  let round = [], idx = 0, results = [], firstTry = true, hideTimer = null, roundNo = 0;

  // ---------- helpers ----------
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(Math.random() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const clean = s => s.toLowerCase().replace(/[’`´]/g, "'").replace(/[?!.,]/g, "").replace(/\s+/g, " ").trim();
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  // ---------- reading aloud ----------
  // English words: British English voice. German words: native German voice.
  // 1st choice: Claude's voice (works in Chrome/Edge on claude.ai).
  // Backup: the browser's own British voice (iPhone, Safari, opened as a file).
  let tts = null, ttsOff = false, turn = 0, keepUtter = null;
  const CLAUDE_VOICES = ["airy", "rounded", "glassy", "buttery"];   // alternate voices
  try { window.claude?.use?.("tts").then(t => { tts = t; }).catch(() => {}); } catch (e) {}

  let gbVoices = [], deVoices = [];
  function loadVoices() {
    try {
      const all = speechSynthesis.getVoices();
      gbVoices = all.filter(v => /^en[-_]GB/i.test(v.lang));
      if (!gbVoices.length) gbVoices = all.filter(v => /^en/i.test(v.lang));
      deVoices = all.filter(v => /^de[-_]DE/i.test(v.lang));
      if (!deVoices.length) deVoices = all.filter(v => /^de/i.test(v.lang));
    } catch (e) {}
  }
  if ("speechSynthesis" in window) {
    loadVoices();
    try { speechSynthesis.addEventListener("voiceschanged", loadVoices); } catch (e) {}
  }

  function browserSpeak(text, btn, lang) {
    if (!("speechSynthesis" in window)) { noVoice(btn); return; }
    if (!gbVoices.length || !deVoices.length) loadVoices();
    const list = lang === "de" ? deVoices : gbVoices;
    if (speechSynthesis.speaking || speechSynthesis.pending) speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    u.lang = lang === "de" ? "de-DE" : "en-GB"; u.rate = 0.85;
    if (list.length) u.voice = list[turn % list.length];   // alternate voices of that language
    u.onstart = () => btn.classList.add("talking");
    u.onend = u.onerror = () => btn.classList.remove("talking");
    keepUtter = u;                      // iPhone: keep a reference or it may stay silent
    speechSynthesis.speak(u);
    if (speechSynthesis.paused) speechSynthesis.resume();
  }

  function noVoice(btn) {
    btn.textContent = "Kein Ton";
    btn.disabled = true;
  }

  function speak(text, btn, lang) {
    turn++;
    if (tts && !ttsOff) {
      btn.classList.add("talking");
      tts.speak(text, { voice: CLAUDE_VOICES[turn % CLAUDE_VOICES.length], language: lang === "de" ? "de-DE" : "en-GB", rate: 0.85 })
        .then(() => btn.classList.remove("talking"))
        .catch(err => {
          btn.classList.remove("talking");
          const code = err && err.code;
          if (code === "not_granted") { ttsOff = true; btn.hidden = true; return; }   // viewer turned it off
          if (code === "stopped" || code === "busy" || code === "no_gesture" || code === "rate_limited") return;
          ttsOff = true; browserSpeak(text, btn, lang);                                   // service failed: use browser voice
        });
      return;
    }
    browserSpeak(text, btn, lang);
  }

  // dir "en": German shown, he types English (Teil 1)
  // dir "de": English shown, he types German (Teil 2)
  const key = (w, dir) => dir + ":" + w.en;
  const answers = it => it.dir === "en" ? [it.w.en] : it.w.de.split(",").map(x => x.trim()).filter(Boolean);
  const shown = it => it.dir === "en" ? it.w.de : it.w.en;
  // no capitals needed; ä/ö/ü/ß may also be typed as ae/oe/ue/ss
  const norm = s => clean(s).replace(/ä/g, "ae").replace(/ö/g, "oe").replace(/ü/g, "ue").replace(/ß/g, "ss");

  // Build one part: an easy new word first, then old mistakes mixed into places 2–5.
  function buildPart(dir) {
    const seenN = w => seen.get(key(w, dir)) || 0;
    const byLeastSeen = list => shuffle(list).sort((a, b) => seenN(a) - seenN(b));
    const missedWords = WORDS.filter(w => missed.has(key(w, dir)));
    const review = shuffle(missedWords).slice(0, Math.min(3, ROUND_SIZE - 1));
    let fresh = byLeastSeen(WORDS.filter(w => !missed.has(key(w, dir))));
    if (fresh.length === 0) fresh = review.splice(0, 1);          // everything was missed: start anyway
    const need = ROUND_SIZE - review.length;
    const newOnes = fresh.slice(0, need);
    while (newOnes.length < need && missedWords.length) {           // tiny word list: fill up
      const extra = missedWords.find(w => !review.includes(w) && !newOnes.includes(w));
      if (!extra) break; newOnes.push(extra);
    }
    const first = newOnes.shift();
    return [first].concat(shuffle(newOnes.concat(review))).filter(Boolean).map(w => ({ w, dir }));
  }

  function lcsLen(a, b) {
    a = a.toLowerCase(); b = b.toLowerCase();
    let prev = new Array(b.length + 1).fill(0);
    for (let i = 1; i <= a.length; i++) {
      const cur = [0];
      for (let j = 1; j <= b.length; j++) cur[j] = a[i - 1] === b[j - 1] ? prev[j - 1] + 1 : Math.max(prev[j], cur[j - 1]);
      prev = cur;
    }
    return prev[b.length];
  }

  // Which letters of the right word did he miss? (longest common subsequence)
  function diff(typed, right) {
    const a = typed.toLowerCase(), b = right.toLowerCase();
    const n = a.length, m = b.length;
    const L = Array.from({ length: n + 1 }, () => new Array(m + 1).fill(0));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--)
      L[i][j] = a[i] === b[j] ? L[i + 1][j + 1] + 1 : Math.max(L[i + 1][j], L[i][j + 1]);
    const okA = new Array(n).fill(false), okB = new Array(m).fill(false);
    for (let k = 0; k < m; k++) if (/[?!.,]/.test(b[k])) okB[k] = true;   // ? and ! are not spelling mistakes
    let i = 0, j = 0;
    while (i < n && j < m) {
      if (a[i] === b[j]) { okA[i] = okB[j] = true; i++; j++; }
      else if (L[i + 1][j] >= L[i][j + 1]) i++; else j++;
    }
    const paint = (s, ok, cls) => [...s].map((c, k) => c === " " ? " " : ok[k] ? esc(c) : `<span class="${cls}">${esc(c)}</span>`).join("");
    return { you: paint(typed, okA, "bad"), right: paint(right, okB, "tricky") };
  }

  const STAGES = ["Samen", "Der Keim kommt", "Keimblätter", "Erstes echtes Blatt", "Die Ranke wächst",
    "Blüten", "Kleiner Kürbis", "Grüner Kürbis", "Er wird orange", "Reif!", "Kürbis-Gesicht"];

  // A pumpkin leaf: five rounded lobes with a fine toothed edge and a notch where the stalk joins.
  function leafSVG(cx, cy, R, tilt, health) {
    const FILL = ["#3d7a2c", "#5f8b2f", "#94913a", "#957746"][health];
    const EDGE = ["#2c5c20", "#476b22", "#73702a", "#735a33"][health];
    const VEIN = ["#79ad5a", "#93b45c", "#bdb566", "#bf9f6c"][health];
    const flat = 0.72 - health * 0.06;                        // thirsty leaves hang flatter
    let d = "";
    for (let k = 0; k <= 90; k++) {
      const t = k / 90 * 2 * Math.PI;
      const lobe = 0.76 + 0.24 * Math.pow(Math.abs(Math.cos(2.5 * (t + Math.PI / 2))), 0.7);
      const dist = Math.abs(((t - Math.PI / 2 + 3 * Math.PI) % (2 * Math.PI)) - Math.PI);
      const notch = dist < 0.38 ? 0.3 + (dist / 0.38) * 0.7 : 1;
      const r = R * lobe * notch * (k % 2 ? 0.96 : 1);
      d += (k ? "L" : "M") + (cx + r * Math.cos(t)).toFixed(1) + " " + (cy + r * Math.sin(t) * flat).toFixed(1);
    }
    const veins = [-90, -18, 54, 126, 198].map(deg => {
      const t = deg * Math.PI / 180, L = R * 0.78;
      return `M${cx} ${cy + R * 0.18 * flat} L${(cx + L * Math.cos(t)).toFixed(1)} ${(cy + L * Math.sin(t) * flat).toFixed(1)}`;
    }).join("");
    return `<g transform="rotate(${tilt} ${cx} ${cy})"><path d="${d}Z" fill="${FILL}" stroke="${EDGE}" stroke-width=".8"/>
      <path d="${veins}" stroke="${VEIN}" stroke-width=".9" fill="none" stroke-linecap="round"/></g>`;
  }

  // One pumpkin at x, at its own stage (5 = flower … 10 = carved face).
  function pumpkinSVG(x, a, G) {
    if (a < 5) return "";
    if (a === 5) {                                            // female flower: tiny fruit under a yellow flower
      return `<ellipse cx="${x}" cy="${G - 3}" rx="3.5" ry="2.8" fill="#6d9a3a"/>
        ${flowerSVG(x + 5, G - 8, 7)}`;
    }
    if (a === 6) {                                            // fruit set: small striped green pumpkin, flower withered
      return `<ellipse cx="${x}" cy="${G - 4}" rx="8" ry="6" fill="url(#pkGreen)"/>
        <path d="M${x - 4} ${G - 9} Q${x} ${G - 11} ${x + 4} ${G - 9}" stroke="#a8c27a" stroke-width=".7" fill="none"/>
        <path d="M${x + 8} ${G - 5} q4 -1 5 -4" stroke="#b58a3a" stroke-width="1.6" fill="none" stroke-linecap="round"/>`;
    }
    const rx = 27, ry = 19, cy = G + 1 - ry;
    const grad = a === 7 ? "pkGreen" : a === 8 ? "pkTurn" : "pkRipe";
    const rib = a === 7 ? "#2f5520" : a === 8 ? "#9c6a1c" : "#b0520d";
    const stemCol = a >= 9 ? "#8b7d52" : "#5d7f2f";
    const ribs = [0.78, 0.5, 0.2].map(f =>
      `<ellipse cx="${x}" cy="${cy}" rx="${rx * f}" ry="${ry}" fill="none" stroke="${rib}" stroke-width="1.1" opacity=".55"/>`).join("");
    let face = "";
    if (a >= 10) {
      const o = `fill="url(#glow)" stroke="#5a2504" stroke-width="1"`;
      face = `<path d="M${x - 14} ${cy - 3} l5 -7 l5 7 z" ${o}/><path d="M${x + 4} ${cy - 3} l5 -7 l5 7 z" ${o}/>
        <path d="M${x - 2.5} ${cy + 2} l2.5 -4 l2.5 4 z" ${o}/>
        <path d="M${x - 15} ${cy + 5} Q${x} ${cy + 17} ${x + 15} ${cy + 5} l-3 2.5 l-2.5 -2 l-3 3 l-3 -3 l-3 3 l-3 -3 l-2.5 2 z" ${o}/>`;
    }
    return `<g>
      <path d="M${x - 1} ${cy - ry + 3} C${x - 1} ${cy - ry - 4} ${x + 3} ${cy - ry - 7} ${x + 7} ${cy - ry - 8}" stroke="${stemCol}" stroke-width="4.5" fill="none" stroke-linecap="round"/>
      <ellipse cx="${x}" cy="${cy}" rx="${rx}" ry="${ry}" fill="url(#${grad})"/>
      ${ribs}
      <ellipse cx="${x - 9}" cy="${cy - 8}" rx="7" ry="3.5" fill="#fff" opacity=".18"/>
      ${face}</g>`;
  }

  function flowerSVG(x, y, R) {
    let d = "";
    for (let k = 0; k < 10; k++) {
      const t = -Math.PI / 2 + k * Math.PI / 5, r = k % 2 ? R * 0.55 : R;
      d += (k ? "L" : "M") + (x + r * Math.cos(t)).toFixed(1) + " " + (y + r * Math.sin(t)).toFixed(1);
    }
    return `<path d="${d}Z" fill="#f7b91e" stroke="#d98a0c" stroke-width=".8" stroke-linejoin="round"/>
      <circle cx="${x}" cy="${y}" r="${R * 0.28}" fill="#e2850d"/>`;
  }

  function drawPlant(bump) {
    const health = Math.min(3, Math.floor(thirst / 2));
    const VINE = ["#4b8634", "#6b9338", "#968c3a", "#866b3a"][health];
    const s = Math.min(growth, 10);
    const G = 118, X = 120;                                   // ground line, where the seed lies
    let back = "", front = "";

    if (s === 0) {                                            // seed in the soil
      front = `<ellipse cx="${X}" cy="${G - 1}" rx="6" ry="3.4" fill="#eadfb8" stroke="#b9a77a" stroke-width=".8" transform="rotate(-18 ${X} ${G - 1})"/>`;
    } else if (s === 1) {                                     // germinating: a hooked shoot with the seed coat
      front = `<path d="M${X} ${G} C${X} ${G - 14} ${X + 9} ${G - 18} ${X + 10} ${G - 10}" stroke="#a9c97a" stroke-width="3" fill="none" stroke-linecap="round"/>
        <ellipse cx="${X + 10}" cy="${G - 9}" rx="4.5" ry="2.6" fill="#eadfb8" stroke="#b9a77a" stroke-width=".7" transform="rotate(70 ${X + 10} ${G - 9})"/>`;
    } else {
      const stemTop = G - 18;
      const cotyledons = s <= 4
        ? `<ellipse cx="${X - 10}" cy="${stemTop - 2}" rx="10" ry="4.6" fill="#86b95a" stroke="#5f8f3a" stroke-width=".7" transform="rotate(-12 ${X - 10} ${stemTop - 2})"/>
           <ellipse cx="${X + 10}" cy="${stemTop - 2}" rx="10" ry="4.6" fill="#86b95a" stroke="#5f8f3a" stroke-width=".7" transform="rotate(12 ${X + 10} ${stemTop - 2})"/>`
        : "";
      // vine running right, later also left
      const right = s >= 4 ? Math.min(300, X + (s === 4 ? 30 : 110 + Math.max(0, growth - 10) * 8)) : X;
      const left = growth >= 23 ? Math.max(30, X - (growth - 22) * 14) : X;
      if (right > X) back += `<path d="M${X} ${G - 2} C${(X + right) / 2} ${G - 7} ${(X + right) / 2} ${G + 1} ${right} ${G - 3}" stroke="${VINE}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
      if (left < X) back += `<path d="M${X} ${G - 2} C${(X + left) / 2} ${G - 7} ${(X + left) / 2} ${G + 1} ${left} ${G - 3}" stroke="${VINE}" stroke-width="3.2" fill="none" stroke-linecap="round"/>`;
      // tendrils
      [X + 45, X + 95, X + 150].filter(t => t < right - 5).forEach(t => {
        back += `<path d="M${t} ${G - 3} q4 -6 8 -3 q3 3 -1 4 q-3 0 -1 -3" stroke="${VINE}" stroke-width="1" fill="none"/>`;
      });
      // the young plant's own stem
      back += `<path d="M${X} ${G} L${X} ${stemTop}" stroke="${VINE}" stroke-width="3.2" stroke-linecap="round"/>`;

      // leaves: first in the middle, then along the vine
      const spots = [];
      if (s >= 3) spots.push([X + 1, stemTop - 10, s === 3 ? 8 : 12, 0]);
      if (s >= 4) spots.push([X - 9, stemTop - 16, 13, -14], [X + 12, stemTop - 20, 15, 12]);
      const along = [[X + 32, 30, 17], [X + 58, 22, 15], [X + 100, 32, 18], [X + 128, 24, 16],
                     [X + 160, 30, 17], [X + 190, 26, 16], [X - 40, 28, 17], [X - 72, 24, 16]];
      along.forEach(([lx, hgt, R], k) => {
        const onRight = lx > X;
        if (s < 5 + Math.min(k, 3)) return;
        if (onRight ? lx > right - 6 : lx < left + 6) return;
        spots.push([lx, G - hgt, R, (k % 2 ? 10 : -10)]);
        back += `<path d="M${lx} ${G - 3} Q${lx - 2} ${G - hgt / 2} ${lx} ${G - hgt + 2}" stroke="${VINE}" stroke-width="1.8" fill="none"/>`;
      });
      const droop = health * 4;
      spots.forEach(([lx, ly, R, tilt]) => { back += leafSVG(lx, ly + health * 1.5, R * 1.2, tilt + (tilt < 0 ? -droop : droop), health); });
      back = cotyledons + back;

      // male flower on its own stalk while the plant is flowering
      if (s === 5 || s === 6) back += `<path d="M${X + 72} ${G - 3} L${X + 72} ${G - 36}" stroke="${VINE}" stroke-width="1.6"/>` + flowerSVG(X + 72, G - 40, 9);

      // pumpkins: one every 10 words, right of the plant first, then far right, then left
      [X + 78, X + 160, X - 70].forEach((px, i) => { front += pumpkinSVG(px, growth - i * 10, G); });
    }

    const stageName = growth <= 10 ? STAGES[growth]
      : growth % 10 === 0 ? STAGES[10] : "Kürbis Nr. " + (Math.floor(growth / 10) + 1) + ": " + (STAGES[growth % 10] || "");
    plantEl.innerHTML = `
      <p class="stage">${esc(stageName)}</p>
      <svg viewBox="22 46 296 84" preserveAspectRatio="xMidYMax meet" aria-hidden="true">
        <defs>
          <radialGradient id="pkGreen" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#7fa34c"/><stop offset="1" stop-color="#2f5a24"/></radialGradient>
          <radialGradient id="pkTurn" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#e9b24a"/><stop offset=".7" stop-color="#c78a2c"/><stop offset="1" stop-color="#7d7a2c"/></radialGradient>
          <radialGradient id="pkRipe" cx=".38" cy=".35" r=".75"><stop offset="0" stop-color="#f7a24a"/><stop offset=".75" stop-color="#e0701a"/><stop offset="1" stop-color="#b4520c"/></radialGradient>
          <radialGradient id="glow" cx=".5" cy=".5" r=".6"><stop offset="0" stop-color="#fff3b0"/><stop offset="1" stop-color="#f0a020"/></radialGradient>
          <linearGradient id="soil" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4f2c"/><stop offset="1" stop-color="#5a3820"/></linearGradient>
        </defs>
        <path d="M-300 ${G} Q 80 ${G - 5} 165 ${G - 4} Q 250 ${G - 5} 640 ${G} L640 140 L-300 140 Z" fill="url(#soil)"/>
        <g fill="#4a2e18"><circle cx="40" cy="${G + 6}" r="1.5"/><circle cx="96" cy="${G + 9}" r="1.2"/><circle cx="210" cy="${G + 7}" r="1.6"/><circle cx="280" cy="${G + 10}" r="1.3"/></g>
        <g fill="#9a6a44"><circle cx="70" cy="${G + 4}" r="1.1"/><circle cx="160" cy="${G + 8}" r="1.3"/><circle cx="250" cy="${G + 5}" r="1"/></g>
        <g class="grower">${back}${front}</g>
      </svg>`;
    plantEl.setAttribute("aria-label", "Dein Kürbis: " + stageName + (health ? ". Er braucht ein richtiges Wort." : ""));
    if (bump) { plantEl.classList.remove("grow"); void plantEl.offsetWidth; plantEl.classList.add("grow"); }
  }

  function drawDots() {
    dotsEl.innerHTML = round.map((it, k) => {
      const r = results[k];
      const cls = r === "star" ? "star" : r === "done" ? "done" : k === idx ? "now" : "";
      const sym = r === "star" ? "⭐" : r === "done" ? "✓" : "";
      const gap = k > 0 && round[k - 1].dir !== it.dir ? " gap" : "";
      return `<span class="dot ${cls}${gap}">${sym}</span>`;
    }).join("");
  }

  function confetti(count) {
    if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
    const box = document.getElementById("confetti");
    const bits = ["⭐", "🎉", "✨", "🌟", "🎈"];
    for (let k = 0; k < count; k++) {
      const s = document.createElement("span");
      s.textContent = bits[k % bits.length];
      s.style.left = Math.random() * 100 + "vw";
      s.style.animationDuration = 1.8 + Math.random() * 1.6 + "s";
      s.style.animationDelay = Math.random() * 0.6 + "s";
      box.appendChild(s);
      setTimeout(() => s.remove(), 4200);
    }
  }

  // ---------- screens ----------
  function startRound() {
    roundNo++;
    round = buildPart("en").concat(buildPart("de")); idx = 0; results = [];
    askWord();
  }

  function askWord(again) {
    clearTimeout(hideTimer);
    const it = round[idx], w = it.w;
    if (!again) { firstTry = true; seen.set(key(w, it.dir), (seen.get(key(w, it.dir)) || 0) + 1); }
    drawDots();
    const part = it.dir === "en" ? 1 : 2;
    const inPart = round.slice(0, idx + 1).filter(x => x.dir === it.dir).length;
    const ofPart = round.filter(x => x.dir === it.dir).length;
    const hello = !again && idx === 0 && roundNo === 1 ? `<p class="hello">Hallo Frederik!</p>` : "";
    card.innerHTML = `
      ${hello}
      <p class="label">${again ? "Noch einmal! Aus dem Kopf." : `Teil ${part} · Wort ${inPart} von ${ofPart}`}</p>
      <p class="lang">${it.dir === "en" ? "Deutsch → Englisch" : "Englisch → Deutsch"}</p>
      <p class="hint pop">${esc(shown(it))}</p>
      <button type="button" class="btn-ghost" id="say">🔊 Anhören</button>
      <form id="f" autocomplete="off">
        <input class="answer" id="answer" type="text" inputmode="text" enterkeyhint="done"
          autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false"
          aria-label="${it.dir === "en" ? "Englisches Wort" : "Deutsches Wort"}" placeholder="${it.dir === "en" ? "Auf Englisch" : "Auf Deutsch"}">
        <button class="btn" type="submit">Fertig ✓</button>
      </form>`;
    const input = document.getElementById("answer");
    const sayBtn = document.getElementById("say");
    // reads the word he has to write: English in part 1, German (German voice) in part 2
    sayBtn.onclick = () => it.dir === "en" ? speak(w.en, sayBtn, "en") : speak(w.de, sayBtn, "de");
    document.getElementById("f").onsubmit = e => {
      e.preventDefault();
      const typed = input.value.trim();
      if (!typed) { input.focus(); return; }
      check(typed);
    };
    input.focus({ preventScroll: true });
  }

  function check(typed) {
    const it = round[idx];
    if (answers(it).some(a => norm(a) === norm(typed))) return gotIt();
    if (firstTry) { missed.add(key(it.w, it.dir)); thirst = Math.min(6, thirst + 1); drawPlant(); }
    firstTry = false;
    showCompare(typed);
  }

  function showCompare(typed) {
    const it = round[idx];
    typed = typed.replace(/\s+/g, " ");
    // with two right answers ("das, dies"), compare with the closer one
    const target = answers(it).reduce((best, a) => lcsLen(typed, a) > lcsLen(typed, best) ? a : best);
    const d = diff(typed, target);
    card.innerHTML = `
      <p class="msg try pop">Fast!</p>
      <div class="compare">
        <div class="row you"><span class="who">Deins:</span><span class="word">${d.you}</span></div>
        <div class="row right"><span class="who">Richtig:</span><span class="word">${d.right}</span></div>
      </div>
      <p class="label">Merke dir das Wort!</p>
      <div class="timer" id="timer"><i></i></div>`;
    requestAnimationFrame(() => document.getElementById("timer").classList.add("run"));
    hideTimer = setTimeout(() => askWord(true), SHOW_MS);
  }

  function gotIt() {
    const it = round[idx], w = it.w;
    const solution = it.dir === "en" ? w.en : w.de;
    if (firstTry) {
      results[idx] = "star"; growth++; thirst = Math.max(0, thirst - 1); drawPlant(true);
      missed.delete(key(w, it.dir));
      drawDots();
      card.innerHTML = `
        <p class="msg good pop">${pick(["Super!", "Richtig!", "Klasse!", "Toll!"])} ⭐</p>
        <p class="word">${esc(solution)}</p>
        <button class="btn green" type="button" id="next">Weiter →</button>`;
      confetti(8);
    } else {
      results[idx] = "done"; growth++; drawPlant(true);
      drawDots();
      card.innerHTML = `
        <p class="msg good pop">Jetzt richtig! 🎉</p>
        <p class="word">${esc(solution)}</p>
        <p class="why">${esc(it.dir === "en" ? w.why : w.whyDe)}</p>
        <button class="btn green" type="button" id="next">Weiter →</button>`;
    }
    const next = document.getElementById("next");
    next.onclick = nextWord;
    next.focus({ preventScroll: true });
  }

  function pick(a) { return a[Math.floor(Math.random() * a.length)]; }

  function nextWord() {
    idx++;
    if (idx >= round.length) return endRound();
    if (round[idx].dir !== round[idx - 1].dir) return partTwo();
    askWord();
  }

  function partTwo() {
    drawDots();
    card.innerHTML = `
      <p class="msg good pop">Teil 1 geschafft! 👍</p>
      <p class="label">Jetzt umgekehrt:</p>
      <p class="hint">Englisch → Deutsch</p>
      <button class="btn" type="button" id="go">Los ▶</button>`;
    const go = document.getElementById("go");
    go.onclick = () => askWord();
    go.focus({ preventScroll: true });
  }

  function endRound() {
    idx = round.length; drawDots();
    const stars = results.filter(r => r === "star").length;
    const words = round.length;
    card.innerHTML = `
      <p class="msg good pop">Runde geschafft! 🎉</p>
      <div class="stars" aria-label="${stars} Sterne">${"⭐".repeat(stars)}${"☆".repeat(words - stars)}</div>
      <p class="score">${stars} von ${words} sofort richtig.</p>
      <p class="label">${stars === words ? "Alles richtig. Wow!" : "Gut gemacht!"}</p>
      <button class="btn" type="button" id="again">Neue Runde ▶</button>`;
    confetti(30);
    document.getElementById("again").onclick = startRound;
  }

  drawPlant();
  startRound();
})();
</script>
